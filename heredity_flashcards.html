<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heredity and Evolution - Flashcards</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #111; padding: 25px; border-radius: 10px; border: 2px solid #00ffcc; }
        .card { background: #1a1a1a; border: 1px solid #00ffcc; border-radius: 8px; height: 180px; display: flex; align-items: center; justify-content: center; padding: 20px; font-size: 18px; cursor: pointer; margin-bottom: 20px; text-align: center; color: #ffff00; box-shadow: 0 4px 8px rgba(0,255,204,0.2); }
        .buttons { display: flex; justify-content: space-between; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .creator { font-size: 14px; color: #ff00ff; margin-bottom: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="creator">Created by A. Rambabu, SA Biology</div>
        <h2 style="color: #00ffcc;">Heredity and Evolution / అనువంశికత - పరిణామం - Flashcards</h2>
        <p style="font-size: 12px; color: #aaa;">కార్డు మీద క్లిక్ చేసి సమాధానం చూడండి (Click card to flip)</p>
        
        <div id="flashcard" class="card" onclick="flipCard()">
            Loading...
        </div>

        <div class="buttons">
            <button onclick="prevCard()">Previous</button>
            <span id="counter" style="align-self: center; font-weight: bold; color: #ffff00;"></span>
            <button onclick="nextCard()">Next</button>
        </div>
    </div>

    <script>
        const cards = [
            { q: "Father of Genetics / జన్యుశాస్త్ర పితామహుడు", a: "Gregor Johann Mendel / గ్రెగర్ జాన్ మెండల్" },
            { q: "Mendel's Plant / మెండల్ బఠానీ శాస్త్రీయ నామం", a: "Pisum sativum / పిసమ్ సటైవమ్" },
            { q: "Theory of Natural Selection / సహజ ఎన్నిక సిద్ధాంతం", a: "Charles Darwin / చార్లెస్ డార్విన్" },
            { q: "Theory of Acquired Characters / ఆర్జిత లక్షణాల సిద్ధాంతం", a: "Jean Baptiste Lamarck / లామార్క్" },
            { q: "Monohybrid Phenotypic Ratio / ఏక సంకర దృశ్యరూప నిష్పత్తి", a: "3 : 1" },
            { q: "Monohybrid Genotypic Ratio / ఏక సంకర జన్యురూప నిష్పత్తి", a: "1 : 2 : 1" },
            { q: "Homologous Organs / సమరూప అవయవాలు", a: "Same structure, diff function / ఒకే నిర్మాణం, వేర్వేరు విధులు" },
            { q: "Analogous Organs / సమవృత్తి అవయవాలు", a: "Diff structure, same function / వేర్వేరు నిర్మాణం, ఒకే విధమైన విధి" },
            { q: "Vestigial Organ in Humans / మానవునిలో అవశేష అవయవం", a: "Appendix / అపెండిక్స్" },
            { q: "Connecting Link / సంధాన సేతువు (సరీసృపాలు - పక్షులు)", a: "Archaeopteryx / ఆర్కియప్టెరిక్స్" },
            { q: "Study of Fossils / శిలాజాల అధ్యయనం", a: "Paleontology / పేలియాంటాలజీ" },
            { q: "Coiner of 'Genetics' / 'జెనెటిక్స్' పదం ప్రవేశపెట్టినది", a: "W. Bateson / డబ్ల్యు. బేట్సన్" },
            { q: "Sudden Inheritable Change / అకస్మాత్తుగా వచ్చే అనువంశిక మార్పు", a: "Mutation / ఉత్పరివర్తనం" },
            { q: "Chemical basis of heredity / అనువంశిక పదార్థం", a: "DNA / డి.ఎన్.ఎ" },
            { q: "Darwin's Book / డార్విన్ గ్రంథం", a: "Origin of Species / ఆరిజిన్ ఆఫ్ స్పీషీస్" }
        ];

        let currentIndex = 0;
        let showingQuestion = true;

        function updateCard() {
            const card = document.getElementById("flashcard");
            card.innerHTML = showingQuestion ? cards[currentIndex].q : cards[currentIndex].a;
            card.style.color = showingQuestion ? "#ffff00" : "#00ffcc";
            document.getElementById("counter").innerText = `${currentIndex + 1} / ${cards.length}`;
        }

        function flipCard() {
            showingQuestion = !showingQuestion;
            updateCard();
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % cards.length;
            showingQuestion = true;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            showingQuestion = true;
            updateCard();
        }

        updateCard();
    </script>
</body>
</html>
