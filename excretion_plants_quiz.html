<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excretion in Plants - Quiz</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; padding: 20px; margin: 0; }
        h1 { color: #ff0; text-align: center; font-size: 22px; margin-bottom: 5px; }
        .creator { color: #0fc; text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 25px; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .question-box { background-color: #111; border: 1px solid #ff0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .question-text { color: #ff0; font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-label { color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 5px; border-radius: 5px; }
        input[type="radio"] { transform: scale(1.2); cursor: pointer; }
        .correct-ans { color: #0f0 !important; font-weight: bold; }
        .wrong-ans { color: #f00 !important; font-weight: bold; }
        .btn { width: 100%; background-color: #ff0; color: #000; padding: 12px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background-color: #cc0; }
        .result-container { text-align: center; display: none; margin-top: 20px; padding: 20px; border: 2px solid #ff0; border-radius: 10px; background-color: #111; }
        .score-text { font-size: 22px; color: #fff; margin-bottom: 15px; }
        .excellent-text { font-size: 28px; color: #ff0; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>Excretion in Plants - Quiz<br>మొక్కలలో విసర్జన - క్విజ్</h1>
    <div class="creator">Created by A.Rambabu, S.A biology</div>
    <div class="quiz-container" id="quiz-container"></div>
    <div class="quiz-container">
        <button class="btn" id="submit-btn" onclick="calculateScore()">Submit / సమర్పించు</button>
        <div class="result-container" id="result-container">
            <div id="excellent-msg" class="excellent-text">Excellent! 🎉 అద్భుతం!</div>
            <div class="score-text" id="score-text"></div>
            <button class="btn" onclick="location.reload()">Retry / మళ్లీ ప్రయత్నించు ↻</button>
        </div>
    </div>
    <script>
        const qData = [
            { q: "1. Plants get rid of excess water by? / మొక్కలు అదనపు నీటిని ఎలా తొలగిస్తాయి?", o: ["Transpiration / భాష్పోత్సేకం", "Respiration / శ్వాసక్రియ", "Photosynthesis / కిరణజన్యసంయోగక్రియ", "Digestion / జీర్ణక్రియ"], a: 0 },
            { q: "2. Solid waste bodies stored in plant fruits are called? / పండ్లలో నిల్వ ఉండే ఘనరూప వ్యర్థాలను ఏమంటారు?", o: ["Resins / రెసిన్లు", "Raphides / రాఫైడ్స్", "Tannins / టానిన్లు", "Gums / జిగుర్లు"], a: 1 },
            { q: "3. Quinine is an antimalarial drug obtained from? / క్వినైన్ అనే మలేరియా మందు దేని నుండి లభిస్తుంది?", o: ["Neem / వేప", "Tobacco / పొగాకు", "Cinchona bark / సించోనా బెరడు", "Coffee / కాఫీ"], a: 2 },
            { q: "4. Nicotine is extracted from which part of the plant? / నికోటిన్ మొక్కలోని ఏ భాగం నుండి తీస్తారు?", o: ["Roots / వేర్లు", "Stem / కాండం", "Leaves / ఆకులు", "Flowers / పూలు"], a: 2 },
            { q: "5. Which alkaloid is used as a painkiller? / నొప్పి నివారిణిగా ఉపయోగపడే ఆల్కలాయిడ్ ఏది?", o: ["Morphine / మార్ఫిన్", "Caffeine / కెఫిన్", "Nimbin / నింబిన్", "Scopolamine / స్కోపోలమైన్"], a: 0 },
            { q: "6. Reserpine is used to treat? / రిసెర్పిన్ దేని నివారణకు ఉపయోగిస్తారు?", o: ["Fever / జ్వరం", "High BP / అధిక రక్తపోటు", "Malaria / మలేరియా", "Cough / దగ్గు"], a: 1 },
            { q: "7. Caffeine acts as a? / కెఫిన్ దేనిగా పనిచేస్తుంది?", o: ["Sedative / మత్తుమందు", "Antiseptic / యాంటీసెప్టిక్", "CNS Stimulant / నాడీవ్యవస్థ ఉద్దీపకం", "Insecticide / కీటకనాశిని"], a: 2 },
            { q: "8. Nimbin, an antiseptic, is obtained from? / నింబిన్ అనే యాంటీసెప్టిక్ దేని నుండి లభిస్తుంది?", o: ["Datura / ఉమ్మెత్త", "Neem / వేప", "Rauwolfia / సర్పగంధి", "Chrysanthemum / చామంతి"], a: 1 },
            { q: "9. Scopolamine is obtained from? / స్కోపోలమైన్ దేని నుండి గ్రహిస్తారు?", o: ["Datura / ఉమ్మెత్త", "Papaver / పాపావర్", "Coffea / కాఫియా", "Acacia / అకేసియా"], a: 0 },
            { q: "10. Pyrethroids are used as? / పైరిత్రాయిడ్స్ ను దేనిగా ఉపయోగిస్తారు?", o: ["Fertilizers / ఎరువులు", "Medicines / మందులు", "Insecticides / కీటకనాశినులు", "Dyes / రంగులు"], a: 2 },
            { q: "11. Tannins are used in? / టానిన్లను దేనిలో ఉపయోగిస్తారు?", o: ["Tanning leather / తోళ్లను పదునుచేయడం", "Cooking / వంట", "Making rubber / రబ్బరు తయారీ", "Making glass / గాజు తయారీ"], a: 0 },
            { q: "12. Resins occur mostly in? / రెసిన్లు ఎక్కువగా ఏ మొక్కలలో ఉంటాయి?", o: ["Angiosperms / ఆవృతబీజాలు", "Gymnosperms (Pinus) / వివృతబీజాలు", "Algae / శైవలాలు", "Fungi / శిలీంద్రాలు"], a: 1 },
            { q: "13. Which substance helps in healing damaged parts of a plant? / మొక్కలు గాయపడినప్పుడు నయం చేయడానికి తోడ్పడేది?", o: ["Latex / లేటెక్స్", "Gums / జిగుర్లు", "Quinine / క్వినైన్", "Alkaloids / ఆల్కలాయిడ్స్"], a: 1 },
            { q: "14. Rubber is prepared from the latex of? / దేని క్షీరం (లేటెక్స్) నుండి రబ్బరు తయారవుతుంది?", o: ["Jatropha / జట్రోఫా", "Hevea brasiliensis / హీవియా బ్రెసిలియెన్సిస్", "Neem / వేప", "Acacia / అకేసియా"], a: 1 },
            { q: "15. Latex from Jatropha is the source of? / జట్రోఫా క్షీరం దేనికి మూలం?", o: ["Bio-diesel / బయో-డీజిల్", "Rubber / రబ్బరు", "Chewing gum / చూయింగ్ గమ్", "Varnish / వార్నిష్"], a: 0 }
        ];

        const qc = document.getElementById('quiz-container');
        qData.forEach((q, i) => {
            let opts = q.o.map((o, j) => `<label class="option-label" id="l-${i}-${j}"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('');
            qc.innerHTML += `<div class="question-box"><div class="question-text">${q.q}</div><div class="options">${opts}</div></div>`;
        });

        function calculateScore() {
            let score = 0, allAns = true;
            qData.forEach((q, i) => {
                const sel = document.querySelector(`input[name="q${i}"]:checked`);
                if (!sel) allAns = false;
                else {
                    document.querySelectorAll(`input[name="q${i}"]`).forEach(r => r.disabled = true);
                    const v = parseInt(sel.value);
                    if (v === q.a) { score++; document.getElementById(`l-${i}-${v}`).classList.add('correct-ans'); }
                    else { document.getElementById(`l-${i}-${v}`).classList.add('wrong-ans'); document.getElementById(`l-${i}-${q.a}`).classList.add('correct-ans'); }
                }
            });
            if (!allAns) return alert("Please answer all questions! / అన్ని ప్రశ్నలకు సమాధానం ఇవ్వండి!");
            document.getElementById('submit-btn').style.display = "none";
            document.getElementById('result-container').style.display = "block";
            document.getElementById('score-text').innerHTML = `Your Score: ${score} / 15`;
            document.getElementById('excellent-msg').style.display = score === 15 ? "block" : "none";
        }
    </script>
</body>
</html>
