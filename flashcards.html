<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Biology - Flashcards</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; color: #333; }
        .container { max-width: 500px; margin: auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        .creator-info { font-size: 14px; color: #555; margin-bottom: 20px; font-weight: 600; }
        
        /* Flashcard Flip CSS */
        .flashcard { perspective: 1000px; width: 100%; height: 220px; margin-bottom: 20px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 10px; }
        .flashcard.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; box-sizing: border-box; border-radius: 10px; font-size: 18px; font-weight: bold; }
        .card-front { background-color: #2980b9; color: white; }
        .card-back { background-color: #27ae60; color: white; transform: rotateY(180deg); }
        
        .btn-control { background: #e67e22; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.3s; margin: 5px; }
        .btn-control:hover { background: #d35400; }
    </style>
</head>
<body>

<div class="container">
    <h2>Biology Flashcards (బయాలజీ ఫ్లాష్ కార్డ్స్)</h2>
    <div class="creator-info">Prepared by A. Rambabu, S.A. Biology</div>
    
    <div class="flashcard" onclick="flipCard()">
        <div class="card-inner" id="cardInner">
            <div class="card-front" id="cardFront">ప్రశ్న ఇక్కడ వస్తుంది...</div>
            <div class="card-back" id="cardBack">జవాబు ఇక్కడ వస్తుంది...</div>
        </div>
    </div>

    <button class="btn-control" onclick="prevCard()">వెనుకకు (Prev)</button>
    <button class="btn-control" onclick="nextCard()">తదుపరి (Next)</button>
</div>

<script>
    const flashcardData = [
        { front: "1. కిరణజన్య సంయోగక్రియ జరిగే కణాంగం ఏది? <br><small>Which cell organelle is for photosynthesis?</small>", back: "క్లోరోప్లాస్ట్ / హరితరేణువు (Chloroplast)" },
        { front: "2. కప్ప చర్మం ద్వారా జరిపే శ్వాసక్రియను ఏమంటారు? <br><small>Respiration through skin in frog?</small>", back: "చర్మ శ్వాసక్రియ (Cutaneous Respiration)" },
        { front: "3. పత్రరంధ్రాలను తెరిచి ఉంచడంలో సహాయపడే కణాలు ఏవి? <br><small>Cells that help open stomata?</small>", back: "రక్షక కణాలు (Guard Cells)" },
        { front: "4. కణపు శక్తి కేంద్రాలు అని వేటిని పిలుస్తారు? <br><small>Powerhouses of the cell?</small>", back: "మైటోకాండ్రియా (Mitochondria)" }
    ];

    let currentIndex = 0;

    function loadCard() {
        document.getElementById("cardFront").innerHTML = flashcardData[currentIndex].front;
        document.getElementById("cardBack").innerHTML = flashcardData[currentIndex].back;
        document.querySelector(".flashcard").classList.remove("flipped");
    }

    function flipCard() {
        document.querySelector(".flashcard").classList.toggle("flipped");
    }

    function nextCard() {
        currentIndex = (currentIndex + 1) % flashcardData.length;
        loadCard();
    }

    function prevCard() {
        currentIndex = (currentIndex - 1 + flashcardData.length) % flashcardData.length;
        loadCard();
    }

    loadCard();
</script>

</body>
</html>
