<html lang="en">

    <style>
        :root {
            --primary: #0f766e; --primary-dark: #115e59; --primary-light: #ccfbf1; 
            --accent: #d97706; --accent-hover: #b45309; --accent-light: #fef3c7; 
            --bg-body: #f8fafc; --bg-card: #ffffff;
            --text-main: #334155; --text-heading: #0f172a; --text-muted: #64748b; 
            --success: #059669; --success-light: #d1fae5; --danger: #e11d48; --danger-light: #ffe4e6;
            --border: #e2e8f0; --radius-md: 12px; --radius-lg: 20px;
            --shadow-sm: 0 2px 4px rgba(15, 118, 110, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(15, 118, 110, 0.1), 0 8px 10px -6px rgba(15, 118, 110, 0.1);
            --shadow-float: 0 20px 30px -10px rgba(15, 118, 110, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.7; overflow-x: hidden; }
        .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        .section-header { text-align: center; margin-bottom: 3.5rem; }
        .section-header h2 { font-size: 2.5rem; color: var(--text-heading); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 1rem; }
        .section-header .divider { height: 4px; width: 60px; background: var(--accent); margin: 0 auto; border-radius: 2px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition); text-decoration: none; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 6px -1px rgba(15, 118, 110, 0.2); }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(15, 118, 110, 0.3); }
        .btn-accent { background: var(--accent); color: white; box-shadow: 0 4px 6px -1px rgba(217, 119, 6, 0.2); }
        .btn-accent:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(217, 119, 6, 0.3); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary-light); }
        .grid { display: grid; gap: 30px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; transition: var(--transition); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; height: 80px; }
        .logo { display: flex; flex-direction: column; }
        .logo h1 { font-size: 1.4rem; color: var(--text-heading); font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
        .logo h1 span { color: var(--primary); }
        .logo p { font-size: 0.75rem; color: var(--accent); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
        .nav-links { list-style: none; display: flex; gap: 4px; }
        .nav-links li a { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; padding: 8px 12px; border-radius: 6px; transition: var(--transition); cursor: pointer; }
        .nav-links li a:hover, .nav-links li a.active { color: var(--primary); background: var(--primary-light); }
        .menu-toggle { display: none; font-size: 1.5rem; color: var(--text-heading); cursor: pointer; padding: 10px; }
        .page-section { display: none; padding: 120px 0 80px; min-height: 100vh; opacity: 0; transform: translateY(20px); transition: opacity 0.4s ease, transform 0.4s ease; }
        .page-section.active { display: block; opacity: 1; transform: translateY(0); }
        .hero-container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; min-height: calc(100vh - 120px); }
        .hero-content h2 { font-size: 1.1rem; color: var(--accent); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1rem; }
        .hero-content h1 { font-size: 4rem; color: var(--text-heading); font-weight: 800; line-height: 1.1; margin-bottom: 1.5rem; letter-spacing: -0.03em; }
        .hero-content p { font-size: 1.25rem; color: var(--text-muted); margin-bottom: 2.5rem; max-width: 90%; }
        .hero-buttons { display: flex; gap: 16px; }
        .hero-graphic { position: relative; height: 500px; width: 100%; display: flex; align-items: center; justify-content: center; }
        .hero-photo-box { width: 320px; height: 400px; background: var(--primary-light); border: 8px solid white; border-radius: var(--radius-lg); box-shadow: var(--shadow-float); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 2; overflow: hidden; text-align: center; }
        .hero-photo-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 5; }
        .hero-photo-box .photo-placeholder { color: var(--primary-dark); font-size: 4rem; z-index: 1; margin-bottom: 15px; }
        .hero-photo-box p { font-size: 0.9rem; font-weight: 700; color: var(--primary); z-index: 1; }
        .hero-orb { position: absolute; background: var(--accent); border-radius: 50%; filter: blur(2px); animation: float 6s ease-in-out infinite; }
        .orb-1 { width: 80px; height: 80px; top: 10%; right: 10%; animation-delay: 0s; }
        .orb-2 { width: 50px; height: 50px; bottom: 20%; left: 15%; animation-delay: -2s; background: var(--primary-light); }
        .orb-3 { width: 30px; height: 30px; top: 40%; left: -5%; animation-delay: -4s; background: #34d399; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .feature-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 40px 30px; text-align: left; box-shadow: var(--shadow-md); border: 1px solid var(--border); cursor: pointer; transition: var(--transition); position: relative; overflow: hidden; }
        .feature-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease; }
        .feature-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-float); border-color: transparent; }
        .feature-card:hover::before { transform: scaleX(1); }
        .feature-icon-wrapper { width: 60px; height: 60px; border-radius: 12px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; transition: var(--transition); }
        .feature-card:hover .feature-icon-wrapper { background: var(--primary); }
        .feature-icon-wrapper i { font-size: 1.8rem; color: var(--primary); transition: var(--transition); }
        .feature-card:hover .feature-icon-wrapper i { color: white; }
        .feature-card h3 { color: var(--text-heading); font-size: 1.25rem; margin-bottom: 8px; font-weight: 700; }
        .feature-card p { color: var(--text-muted); font-size: 0.95rem; }
        .content-card { background: var(--bg-card); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: var(--transition); display: flex; flex-direction: column; }
        .content-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
        .content-media { height: 200px; background: #e2e8f0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .content-media video, .content-media img { width: 100%; height: 100%; object-fit: cover; }
        .content-media .badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; backdrop-filter: blur(4px); }
        .content-info { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .content-info h4 { color: var(--text-heading); font-size: 1.1rem; margin-bottom: 8px; font-weight: 700; }
        .content-info p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
        .lesson-viewer { background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; }
        .lesson-header-area { padding: 40px; border-bottom: 1px solid var(--border); background: var(--bg-body); }
        .lesson-header-area h2 { font-size: 2rem; color: var(--text-heading); margin-bottom: 12px; }
        .obj-box { display: inline-flex; align-items: center; gap: 8px; background: var(--primary-light); color: var(--primary-dark); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; }
        .diagram-workspace { display: grid; grid-template-columns: 1fr 350px; min-height: 500px; background: #0f172a; }
        .diagram-visual { position: relative; padding: 40px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .css-cell { width: 320px; height: 320px; background: rgba(52, 211, 153, 0.1); border: 4px solid #34d399; border-radius: 30px; position: relative; transition: all 0.5s ease; box-shadow: inset 0 0 40px rgba(52, 211, 153, 0.2); }
        .organelle { position: absolute; cursor: pointer; transition: var(--transition); }
        .org-nucleus { width: 80px; height: 80px; background: #818cf8; border-radius: 50%; top: 40px; left: 40px; box-shadow: 0 0 15px rgba(129, 140, 248, 0.5); display: flex; align-items: center; justify-content: center; }
        .org-nucleus::after { content:''; width: 30px; height: 30px; background: #4f46e5; border-radius: 50%; }
        .org-vacuole { width: 140px; height: 180px; background: rgba(56, 189, 248, 0.3); border: 2px solid #38bdf8; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; bottom: 30px; right: 30px; }
        .org-mito { width: 60px; height: 30px; background: #fb923c; border-radius: 15px; bottom: 60px; left: 40px; transform: rotate(-30deg); display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; }
        .org-mito::before, .org-mito::after { content:''; width: 80%; height: 2px; background: #c2410c; }
        .org-chloro { width: 50px; height: 30px; background: #22c55e; border-radius: 15px; top: 60px; right: 40px; transform: rotate(15deg); display: flex; gap: 4px; align-items: center; justify-content: center; }
        .org-chloro span { width: 8px; height: 8px; background: #14532d; border-radius: 50%; }
        .organelle:hover, .organelle.active { transform: scale(1.1) !important; filter: brightness(1.2); box-shadow: 0 0 20px rgba(255,255,255,0.5); z-index: 10; }
        .hotspot-label { position: absolute; background: rgba(255,255,255,0.9); color: #0f172a; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; pointer-events: none; opacity: 0; transition: 0.3s; white-space: nowrap; top: -25px; left: 50%; transform: translateX(-50%); }
        .organelle:hover .hotspot-label, .organelle.active .hotspot-label { opacity: 1; top: -35px; }
        .diagram-panel { background: white; padding: 40px; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .panel-placeholder { text-align: center; color: var(--text-muted); margin-top: 50px; }
        .panel-placeholder i { font-size: 3rem; color: var(--border); margin-bottom: 16px; }
        .info-content { display: none; animation: fadeIn 0.4s ease; }
        .info-content.active { display: block; }
        .info-content h3 { font-size: 1.5rem; color: var(--text-heading); margin-bottom: 8px; }
        .info-tag { display: inline-block; padding: 4px 12px; background: var(--primary-light); color: var(--primary-dark); border-radius: 12px; font-size: 0.8rem; font-weight: 600; margin-bottom: 20px; }
        .info-content p { color: var(--text-main); line-height: 1.6; }
        .cell-toggle { display: flex; gap: 10px; position: absolute; top: 20px; left: 20px; z-index: 10; }
        .cell-toggle button { padding: 8px 16px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .cell-toggle button.active { background: var(--primary); border-color: var(--primary); }
        .quiz-wrapper { max-width: 800px; margin: 0 auto; background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; position: relative; }
        .quiz-setup-area { padding: 60px 40px; text-align: center; }
        .custom-select { width: 100%; max-width: 400px; padding: 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; color: var(--text-heading); font-weight: 600; margin: 24px auto; display: block; outline: none; transition: border-color 0.3s; }
        .custom-select:focus { border-color: var(--primary); }
        .quiz-active-area { display: none; }
        .progress-container { width: 100%; height: 6px; background: var(--border); }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }
        .quiz-header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg-body); }
        .q-count { font-weight: 700; color: var(--text-muted); font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; }
        .q-score { font-weight: 800; color: var(--primary); background: var(--primary-light); padding: 4px 12px; border-radius: 20px; }
        .quiz-body { padding: 40px; }
        .question-text { font-size: 1.3rem; color: var(--text-heading); font-weight: 700; margin-bottom: 30px; line-height: 1.4; }
        .options-list { display: flex; flex-direction: column; gap: 16px; }
        .option-btn { padding: 16px 20px; background: var(--bg-body); border: 2px solid var(--border); border-radius: 12px; text-align: left; font-size: 1rem; font-weight: 600; color: var(--text-main); cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); transform: scale(1.01); }
        .option-btn.correct { background: var(--success-light); border-color: var(--success); color: var(--success); }
        .option-btn.incorrect { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
        .option-btn:disabled { cursor: default; }
        .quiz-footer { padding: 20px 40px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; min-height: 90px; }
        .feedback-toast { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; opacity: 0; transform: translateX(-20px); transition: 0.3s; }
        .feedback-toast.show { opacity: 1; transform: translateX(0); }
        .feedback-toast.correct { color: var(--success); }
        .feedback-toast.incorrect { color: var(--danger); }
        .quiz-result-area { display: none; padding: 60px 40px; text-align: center; }
        .circular-chart { position: relative; width: 180px; height: 180px; border-radius: 50%; background: conic-gradient(var(--primary) calc(var(--percentage) * 1%), var(--bg-body) 0); margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.05), var(--shadow-md); }
        .circular-chart::before { content: ''; position: absolute; width: 150px; height: 150px; background: var(--bg-card); border-radius: 50%; }
        .chart-content { position: relative; z-index: 1; display: flex; flex-direction: column; }
        .chart-score { font-size: 3rem; font-weight: 800; color: var(--text-heading); line-height: 1; }
        .chart-total { font-size: 1rem; color: var(--text-muted); font-weight: 600; }
        .profile-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 50px; box-shadow: var(--shadow-md); display: grid; grid-template-columns: 250px 1fr; gap: 40px; align-items: center; }
        .profile-img-placeholder { width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 6rem; color: var(--primary); box-shadow: 0 10px 25px rgba(15, 118, 110, 0.2); border: 8px solid white; }
        .profile-content h3 { font-size: 2.5rem; color: var(--text-heading); margin-bottom: 5px; line-height: 1.1; }
        .profile-content h4 { font-size: 1.2rem; color: var(--accent); margin-bottom: 20px; font-weight: 600; }
        .mission-quote { font-style: italic; font-size: 1.1rem; color: var(--primary-dark); padding-left: 20px; border-left: 4px solid var(--accent); margin: 25px 0; background: var(--primary-light); padding: 15px 20px; border-radius: 0 12px 12px 0; }
        footer { background: #0f172a; color: white; padding: 80px 0 20px; margin-top: 80px; }
        .footer-grid { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 40px; margin-bottom: 20px; }
        .footer-brand h2 { color: white; font-weight: 800; margin-bottom: 8px; }
        .footer-brand h2 span { color: var(--primary-light); }
        .footer-brand p { color: var(--text-muted); margin-bottom: 20px; }
        .social-icons { display: flex; gap: 16px; }
        .social-icons a { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: white; transition: 0.3s; text-decoration: none; }
        .social-icons a:hover { background: var(--primary); transform: translateY(-3px); }
        .footer-links h4 { font-size: 1.1rem; margin-bottom: 20px; color: white; }
        .footer-links ul { list-style: none; }
        .footer-links li { margin-bottom: 12px; }
        .footer-links a { color: #94a3b8; text-decoration: none; transition: 0.3s; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .footer-links a:hover { color: var(--primary-light); transform: translateX(5px); }
        .copyright { text-align: center; color: #64748b; font-size: 0.9rem; }
        @media (max-width: 992px) {
            .hero-container { grid-template-columns: 1fr; text-align: center; padding-top: 40px; }
            .hero-content p { margin: 0 auto 2.5rem; }
            .hero-buttons { justify-content: center; }
            .hero-graphic { height: 450px; }
            .diagram-workspace { grid-template-columns: 1fr; }
            .diagram-panel { border-left: none; border-top: 1px solid var(--border); }
            .profile-card { grid-template-columns: 1fr; text-align: center; }
            .profile-img-placeholder { width: 200px; margin: 0 auto; }
            .mission-quote { text-align: left; }
        }
        @media (max-width: 768px) {
            .menu-toggle { display: block; }

    <!-- JAVASCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.querySelectorAll('.nav-link');
            const triggers = document.querySelectorAll('.nav-trigger');
            const sections = document.querySelectorAll('.page-section');
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const navLinksContainer = document.getElementById('nav-links');

            mobileMenuBtn.addEventListener('click', () => { navLinksContainer.classList.toggle('active'); });

            function navigateTo(targetId) {
                const currentActive = document.querySelector('.page-section.active');
                if(currentActive) {
                    currentActive.style.opacity = '0';
                    currentActive.style.transform = 'translateY(20px)';
                    setTimeout(() => {
                        currentActive.classList.remove('active');
                        showNewSection(targetId);
                    }, 300); 
                } else { showNewSection(targetId); }
            }

            function showNewSection(targetId) {
                const targetSection = document.getElementById(targetId);
                if(targetSection) {
                    targetSection.classList.add('active');
                    setTimeout(() => { targetSection.style.opacity = '1'; targetSection.style.transform = 'translateY(0)'; }, 50);
                    navLinks.forEach(link => {
                        link.classList.remove('active');
                        if(link.getAttribute('data-target') === targetId) { link.classList.add('active'); }
                    });
                    navLinksContainer.classList.remove('active');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    if(targetId === 'lessons') closeLesson();
                }
            }

            [...navLinks, ...triggers].forEach(btn => {
                btn.addEventListener('click', (e) => { e.preventDefault(); navigateTo(btn.getAttribute('data-target')); });
            });

            window.addEventListener('scroll', () => {
                const nav = document.querySelector('.navbar');
                if (window.scrollY > 20) { nav.style.boxShadow = '0 4px 20px rgba(0,0,0,0.08)'; } 
                else { nav.style.boxShadow = 'none'; }
            });

            const organelles = document.querySelectorAll('.organelle');
            const infoContents = document.querySelectorAll('.info-content');
            const placeholder = document.getElementById('info-placeholder');

            organelles.forEach(org => {
                org.addEventListener('click', () => {
                    organelles.forEach(o => o.classList.remove('active'));
                    infoContents.forEach(c => c.classList.remove('active'));
                    org.classList.add('active');
                    placeholder.style.display = 'none';
                    document.getElementById(org.getAttribute('data-target')).classList.add('active');
                });
            });

            window.switchCellType = function(type) {
                const btnPlant = document.getElementById('btn-plant');
                const btnAnimal = document.getElementById('btn-animal');
                const cellVisual = document.getElementById('visual-cell');
                const chloro = document.getElementById('visual-chloro');
                const wall = document.getElementById('visual-wall');
                const vacuole = document.getElementById('visual-vacuole');
                const tagVacuole = document.getElementById('tag-vacuole');

                // Reset selection state
                organelles.forEach(o => o.classList.remove('active'));
                infoContents.forEach(c => c.classList.remove('active'));
                placeholder.style.display = 'block';

                if(type === 'plant') {
                    btnPlant.classList.add('active'); btnAnimal.classList.remove('active');
                    cellVisual.style.borderRadius = '30px'; cellVisual.style.borderColor = '#34d399'; cellVisual.style.background = 'rgba(52, 211, 153, 0.1)';
                    chloro.style.display = 'flex'; wall.style.display = 'block';
                    vacuole.style.width = '140px'; vacuole.style.height = '180px';
                    tagVacuole.innerHTML = '<i class="fas fa-expand"></i> Large & Central';
                } else {
                    btnAnimal.classList.add('active'); btnPlant.classList.remove('active');
                    cellVisual.style.borderRadius = '40% 60% 70% 30% / 40% 50% 60% 50%'; cellVisual.style.borderColor = '#f472b6'; cellVisual.style.background = 'rgba(244, 114, 182, 0.1)';
                    chloro.style.display = 'none'; wall.style.display = 'none';
                    vacuole.style.width = '40px'; vacuole.style.height = '40px';
                    tagVacuole.innerHTML = '<i class="fas fa-compress"></i> Small & Temporary';
                }
            }

            window.openLesson = function(id) { document.getElementById('lesson-library').style.display = 'none'; document.getElementById('active-lesson').style.display = 'block'; window.scrollTo({ top: 0, behavior: 'smooth' }); switchCellType('plant'); }
            window.closeLesson = function() { document.getElementById('lesson-library').style.display = 'block'; document.getElementById('active-lesson').style.display = 'none'; }
            window.startQuizFromLesson = function(topic) { navigateTo('mcq'); setTimeout(() => { document.getElementById('quiz-topic').value = topic; }, 400); }

            // MCQ Database
            const quizDB = {
                "cell-structure": [
                    { q: "Which structure is completely absent in animal cells?", opts: ["Mitochondria", "Cell Membrane", "Cell Wall", "Nucleus"], ans: 2 },
                    { q: "What is the primary function of Chloroplasts?", opts: ["Cell division", "Photosynthesis", "Energy production", "Storing water"], ans: 1 },
                    { q: "Which organelle is known as the 'powerhouse' of the cell?", opts: ["Nucleus", "Ribosome", "Vacuole", "Mitochondrion"], ans: 3 },
                    { q: "Describe the vacuole structure in a mature plant cell.", opts: ["Many small vacuoles", "Absent", "One large central vacuole", "Same as animal cell"], ans: 2 },
                    { q: "Which feature determines the fixed, rigid shape of a plant cell?", opts: ["Cell Wall", "Cytoplasm", "Cell Membrane", "Cytoskeleton"], ans: 0 }
                ]
            };

            let currentData = []; let qIndex = 0; let score = 0;
            const elSetup = document.getElementById('quiz-setup'); const elActive = document.getElementById('quiz-active'); const elResult = document.getElementById('quiz-result');
            const btnNext = document.getElementById('btn-next-q'); const progressBar = document.getElementById('quiz-progress-bar'); const feedbackToast = document.getElementById('q-feedback');

            document.getElementById('btn-start-quiz').addEventListener('click', () => {
                const topic = document.getElementById('quiz-topic').value;
                if(quizDB[topic]) { currentData = quizDB[topic]; qIndex = 0; score = 0; elSetup.style.display = 'none'; elResult.style.display = 'none'; elActive.style.display = 'block'; loadNextQuestion(); }
            });

            function loadNextQuestion() {
                const q = currentData[qIndex];
                document.getElementById('q-counter').innerText = `Question ${qIndex + 1} of ${currentData.length}`;
                document.getElementById('q-score').innerText = `Score: ${score}`;
                progressBar.style.width = `${((qIndex) / currentData.length) * 100}%`;
                document.getElementById('q-text').innerText = q.q;
                const optsContainer = document.getElementById('q-options'); optsContainer.innerHTML = '';
                q.opts.forEach((opt, idx) => {
                    const btn = document.createElement('button'); btn.className = 'option-btn';
                    btn.innerHTML = `<span>${opt}</span> <i class="fas fa-circle" style="color: var(--border); font-size: 0.8rem;"></i>`;
                    btn.onclick = () => handleAnswer(btn, idx, q.ans); optsContainer.appendChild(btn);
                });
                feedbackToast.className = 'feedback-toast'; btnNext.style.visibility = 'hidden';
            }

            function handleAnswer(selectedBtn, selectedIdx, correctIdx) {
                const allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = true);
                const icon = selectedBtn.querySelector('i');
                if(selectedIdx === correctIdx) {
                    selectedBtn.classList.add('correct'); icon.className = 'fas fa-check-circle'; score++;
                    feedbackToast.className = 'feedback-toast show correct'; feedbackToast.innerHTML = '<i class="fas fa-check-circle"></i> Excellent!';
                } else {
                    selectedBtn.classList.add('incorrect'); icon.className = 'fas fa-times-circle';
                    allBtns[correctIdx].classList.add('correct'); allBtns[correctIdx].querySelector('i').className = 'fas fa-check-circle';
                    feedbackToast.className = 'feedback-toast show incorrect'; feedbackToast.innerHTML = '<i class="fas fa-times-circle"></i> Incorrect. Review the lesson.';
                }
                document.getElementById('q-score').innerText = `Score: ${score}`;
                btnNext.innerHTML = (qIndex === currentData.length - 1) ? 'View Results <i class="fas fa-flag-checkered"></i>' : 'Next Question <i class="fas fa-arrow-right"></i>';
                btnNext.style.visibility = 'visible';
            }

            btnNext.addEventListener('click', () => {
                qIndex++; if(qIndex < currentData.length) { loadNextQuestion(); } else { showFinalResults(); }
            });

            function showFinalResults() {
                elActive.style.display = 'none'; elResult.style.display = 'block'; progressBar.style.width = '100%';
                const total = currentData.length; const pct = Math.round((score / total) * 100);
                document.getElementById('res-score').innerText = score; document.getElementById('res-total').innerText = total;
                const chart = document.getElementById('result-chart'); chart.style.setProperty('--percentage', 0);
                setTimeout(() => { chart.style.transition = '--percentage 1.5s ease-out'; chart.style.setProperty('--percentage', pct); }, 100);
                const msg = document.getElementById('res-message');
                if(pct === 100) { msg.innerText = "Outstanding! Perfect Score!"; msg.style.color = "var(--success)"; }
                else if(pct >= 60) { msg.innerText = "Good Job! You're on the right track."; msg.style.color = "var(--primary)"; }
                else { msg.innerText = "Keep practicing. You'll get it next time!"; msg.style.color = "var(--accent)"; }
            }

            document.getElementById('btn-restart-quiz').addEventListener('click', () => { elResult.style.display = 'none'; elSetup.style.display = 'block'; });
        });
    </script>
