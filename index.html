<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A. RAMBABU - DIGITAL BIOLOGY HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --primary-light: #ccfbf1;
            --accent: #d97706;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #334155;
            --text-heading: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-md: 12px;
            --shadow-sm: 0 2px 4px rgba(15, 118, 110, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(15, 118, 110, 0.1);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.7; overflow-x: hidden; }
        
        /* Master Lock Screen */
        #site-lock-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(15px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .site-lock-card {
            background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 2px solid var(--primary);
        }
        .site-lock-card h2 { color: var(--text-heading); margin-bottom: 10px; font-size: 1.6rem; }
        .site-lock-input {
            width: 100%; padding: 15px; border: 2px solid var(--border); border-radius: 10px;
            font-size: 1.5rem; text-align: center; letter-spacing: 5px; margin-bottom: 20px; outline: none;
            font-weight: bold; color: var(--primary);
        }
        .unlock-btn {
            background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px;
            font-size: 1.1rem; font-weight: 700; width: 100%; cursor: pointer; transition: 0.2s;
        }
        .unlock-btn:active { transform: scale(0.98); background: var(--primary-dark); }
        .hidden-content { display: none; }
        
        /* Navbar */
        .navbar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; height: 70px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .logo h1 { font-size: 1.2rem; color: var(--text-heading); font-weight: 800; line-height: 1.2; }
        .logo h1 span { color: var(--accent); }
        .logo p { font-size: 0.7rem; color: var(--primary); font-weight: 700; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 10px; list-style: none; }
        .nav-links li a { text-decoration: none; color: var(--text-muted); font-weight: 600; padding: 8px 15px; border-radius: 6px; transition: var(--transition); }
        .nav-links li a:hover, .nav-links li a.active { color: var(--primary); background: var(--primary-light); }
        .menu-toggle { display: none; font-size: 1.5rem; cursor: pointer; color: var(--primary); }
        
        /* Main Layout */
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .section-header { text-align: center; margin-bottom: 3rem; margin-top: 2rem; }
        .section-header h2 { font-size: 2.2rem; color: var(--text-heading); font-weight: 800; }
        
        /* Folders & Grid */
        .folders-scroll { width: 100%; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .folders-bar { display: flex; gap: 10px; width: max-content; padding: 5px; }
        .folder-tab { background: white; border: 2px solid var(--border); border-radius: 30px; padding: 8px 20px; font-size: 0.95rem; font-weight: 600; color: var(--text-main); cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .folder-tab:hover, .folder-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .grid { display: grid; gap: 25px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .content-card { background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow-sm); transition: var(--transition); cursor: pointer; display: flex; flex-direction: column; }
        .content-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
        .content-media { height: 160px; display: flex; align-items: center; justify-content: center; position: relative; }
        .badge { position: absolute; top: 10px; right: 10px; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .content-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .content-info h4 { font-size: 1.1rem; color: var(--text-heading); margin-bottom: 8px; }
        .content-info p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; }
        .card-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav-links { display: none; position: absolute; top: 70px; left: 0; width: 100%; background: white; flex-direction: column; padding: 20px; border-bottom: 1px solid var(--border); box-shadow: var(--shadow-md); }
            .nav-links.active { display: flex; }
        }
    </style>
</head>
<body>
    <div id="site-lock-overlay">
        <div class="site-lock-card">
            <i class="fas fa-shield-alt" style="color: var(--primary); font-size: 2.5rem; margin-bottom: 15px;"></i>
            <h2>Restricted Access</h2>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Enter Master Password</p>
            <input type="password" id="passInput" class="site-lock-input" placeholder="••••••" maxlength="6">
            <button id="unlockBtn" class="unlock-btn">Unlock & Enter</button>
        </div>
    </div>

    <div id="mainContent" class="hidden-content">
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <h1>DIGITAL BIOLOGY <span>HUB</span></h1>
                    <p>By A. Rambabu</p>
                </div>
                <div class="menu-toggle" id="mobileMenuBtn"><i class="fas fa-bars"></i></div>
                <ul class="nav-links" id="navLinks">
                    <li><a href="#" class="nav-link active" data-target="library">Resource Library</a></li>
                </ul>
            </div>
        </nav>

        <section id="library" class="page-section">
            <div class="container">
                <div class="section-header">
                    <h2>Digital Resource Library</h2>
                </div>
                <div class="folders-scroll">
                    <div class="folders-bar">
                        <button class="folder-tab active" data-filter="all"><i class="fas fa-globe"></i> All</button>
                        <button class="folder-tab" data-filter="pdf"><i class="fas fa-file-pdf"></i> PDFs</button>
                        <button class="folder-tab" data-filter="notes"><i class="fas fa-book-open"></i> Important Notes</button>
                        <button class="folder-tab" data-filter="tlm"><i class="fas fa-tools"></i> TLM</button>
                        <button class="folder-tab" data-filter="images"><i class="fas fa-images"></i> Images</button>
                    </div>
                </div>
                <div class="grid" id="dynamic-grid">
                    <p style="text-align: center; grid-column: 1/-1;">loading resources...</p>
                </div>
            </div>
        </section>
    </div>

    <script src="data.js"></script>
    <script>
        const unlockBtn = document.getElementById('unlockBtn');
        const passInput = document.getElementById('passInput');
        const overlay = document.getElementById('site-lock-overlay');
        const mainContent = document.getElementById('mainContent');

        if(sessionStorage.getItem('hub_unlocked') === 'true') {
            overlay.style.display = 'none';
            mainContent.style.display = 'block';
            initSiteLogic();
        }

        function processUnlock() {
            const pass = passInput.value.trim();
            if(pass === '652128') {
                overlay.style.display = 'none';
                mainContent.style.display = 'block';
                sessionStorage.setItem('hub_unlocked', 'true');
                initSiteLogic();
            } else {
                alert('Incorrect password! Please try again.');
                passInput.value = '';
            }
        }

        unlockBtn.addEventListener('click', processUnlock);
        passInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') processUnlock(); });

        function initSiteLogic() {
            document.getElementById('mobileMenuBtn').addEventListener('click', () => {
                document.getElementById('navLinks').classList.toggle('active');
            });

            const grid = document.getElementById('dynamic-grid');
            if(typeof resourceData !== 'undefined') {
                renderCards('all');
            } else {
                grid.innerHTML = `<p style="color: red; text-align: center;">Error: data.js file not found!</p>`;
            }

            const folderTabs = document.querySelectorAll('.folder-tab');
            folderTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    folderTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderCards(tab.getAttribute('data-filter'));
                });
            });
        }

        function renderCards(filter) {
            grid.innerHTML = '';
            let count = 0;
            resourceData.forEach(item => {
                if(filter === 'all' || item.folders.includes(filter)) {
                    const card = document.createElement('div');
                    card.className = 'content-card';
                    card.addEventListener('click', () => {
                        if(item.type === 'youtube_link') window.open(item.url, '_blank');
                        else window.location.href = item.url;
                    });
                    card.innerHTML = `
                        <div class="content-media" style="background: ${item.bgColor}">
                            <i class="${item.icon}" style="color: ${item.color}; font-size: 2.5rem;"></i>
                            <span class="badge" style="background: ${item.color};">${item.badgeText}</span>
                        </div>
                        <div class="content-info">
                            <h4>${item.title}</h4>
                            <p>${item.description}</p>
                            <div class="card-btn" style="background: ${item.color}; color: white;">
                                <i class="${item.buttonIcon}"></i> ${item.buttonText}
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                    count++;
                }
            });
            if(count === 0) grid.innerHTML = `<p style="text-align: center; color: #64748b; padding: 40px; grid-column: 1/-1;">This Folder is Empty</p>`;
        }
    </script>
</body>
</html>
