<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Resources - Flashcards</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #111; padding: 25px; border-radius: 10px; border: 2px solid #00ffcc; }
        .card { background: #1a1a1a; border: 1px solid #00ffcc; border-radius: 8px; height: 180px; display: flex; align-items: center; justify-content: center; padding: 20px; font-size: 18px; cursor: pointer; margin-bottom: 20px; text-align: center; color: #ffff00; box-shadow: 0 4px 8px rgba(0,255,204,0.2); }
        .buttons { display: flex; justify-content: space-between; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .creator { font-size: 14px; color: #ff00ff; margin-bottom: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="creator">Created by A. Rambabu, SA Biology</div>
        <h2 style="color: #00ffcc;">Natural Resources / సహజ వనరులు - Flashcards</h2>
        <p style="font-size: 12px; color: #aaa;">కార్డు మీద క్లిక్ చేసి సమాధానం చూడండి (Click card to flip)</p>
        
        <div id="flashcard" class="card" onclick="flipCard()">
            Loading...
        </div>

        <div class="buttons">
            <button onclick="prevCard()">Previous</button>
            <span id="counter" style="align-self: center; font-weight: bold; color: #ffff00;"></span>
            <button onclick="nextCard()">Next</button>
        </div>
    </div>

    <script>
        const cards = [
            { q: "Renewable Resource / పునరుద్ధరించదగిన వనరు", a: "Solar Energy / సౌర శక్తి" },
            { q: "Non-Renewable Resource / పునరుద్ధరించలేని వనరు", a: "Coal & Petroleum / బొగ్గు, పెట్రోలియం" },
            { q: "Water percentage on Earth / భూమిపై నీటి శాతం", a: "71%" },
            { q: "Fossil Fuels / శిలాజ ఇంధనాలు", a: "Coal, Petroleum / బొగ్గు, పెట్రోలియం" },
            { q: "3R Principle / 3R సూత్రం", a: "Reduce, Reuse, Recycle" },
            { q: "Main gas in Biogas / బయోగ్యాస్ ప్రధాన వాయువు", a: "Methane / మీథేన్" },
            { q: "Sustainable Development / సుస్థిర అభివృద్ధి", a: "Care for future generations / భవిష్యత్ తరాల సంక్షేమం" },
            { q: "Chipko Movement / చిప్కో ఉద్యమం", a: "Forest conservation / అడవల పరిరక్షణ" },
            { q: "Bishnoi Community / బిష్ణోయ్ సంఘం", a: "Wildlife protection / వన్యప్రాణుల రక్షణ" },
            { q: "Rainwater Harvesting / వర్షపు నీటి నిల్వ", a: "Groundwater recharge / భూగర్భ జలాల పెంపు" },
            { q: "Deforestation effect / అడవుల నరికివేత ప్రభావం", a: "Soil erosion / నేల కోత" },
            { q: "Van Mahotsav / వన మహోత్సవం", a: "Planting trees / మొక్కలు నాటడం" },
            { q: "Recyclable Metal / రీసైకిల్ చేసే లోహం", a: "Aluminum / అల్యూమినియం" },
            { q: "Eco-friendly Practice / పర్యావరణ హిత పద్ధతి", a: "Using cloth bags / గుడ్డ సంచులు వాడటం" },
            { q: "Ultimate Energy Source / ప్రధాన శక్తి వనరు", a: "Sun / సూర్యుడు" }
        ];

        let currentIndex = 0;
        let showingQuestion = true;

        function updateCard() {
            const card = document.getElementById("flashcard");
            card.innerHTML = showingQuestion ? cards[currentIndex].q : cards[currentIndex].a;
            card.style.color = showingQuestion ? "#ffff00" : "#00ffcc";
            document.getElementById("counter").innerText = `${currentIndex + 1} / ${cards.length}`;
        }

        function flipCard() {
            showingQuestion = !showingQuestion;
            updateCard();
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % cards.length;
            showingQuestion = true;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            showingQuestion = true;
            updateCard();
        }

        updateCard();
    </script>
</body>
</html>
