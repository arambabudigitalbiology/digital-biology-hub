<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cell_matching</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; padding: 15px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 680px; background: #121212; padding: 20px; border-radius: 12px; border: 2px solid #00ffcc; box-sizing: border-box; }
        .branding { font-size: 15px; color: #ff00ff; margin-bottom: 10px; text-align: center; font-weight: bold; }
        .header-title { color: #00ffcc; text-align: center; font-size: 20px; margin-top: 0; margin-bottom: 15px; }
        .match-row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; background: #1a1a1a; padding: 10px; border-radius: 6px; font-size: 14px; color: #ffff00; gap: 10px; }
        select { background: #262626; color: #ffffff; padding: 8px; border: 1px solid #00ffcc; border-radius: 4px; max-width: 250px; font-size: 13px; outline: none; }
        .submit-btn { background: #ffff00; color: #000; font-weight: bold; padding: 12px; width: 100%; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; font-size: 16px; text-transform: uppercase; }
        #result { margin-top: 20px; text-align: center; }
        .score-text { font-size: 20px; color: #ffff00; font-weight: bold; margin-bottom: 8px; }
        .badge { font-size: 22px; color: #00ffcc; font-weight: bold; margin-bottom: 15px; display: block; }
        .retry-btn { background: #00ffcc; color: #000; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="container">
    <div class="branding">created by ARambabu SA biology</div>
    <h2 class="header-title">Cell Structure & Functions - Matching / జతపరుచు ఆట</h2>
    <div id="matching-form"></div>
    <button class="submit-btn" onclick="checkMatches()">సమాధానాలు సరిచూడండి (SUBMIT)</button>
    <div id="result"></div>
</div>

<script>
const pairs = [
    { term: "1. Mitochondria / మైటోకాండ్రియా", match: "Powerhouse of cell / కణ శక్త్యాగారాలు" },
    { term: "2. Ribosomes / రైబోజోములు", match: "Protein synthesis / ప్రొటీన్ సంశ్లేషణ" },
    { term: "3. Lysosomes / లైసోజోములు", match: "Suicidal bags / స్వయం విచ్ఛిత్తి సంచులు" },
    { term: "4. Robert Brown / రాబర్ట్ బ్రౌన్", match: "Discovered Nucleus / కేంద్రకాన్ని కనుగొనెను" },
    { term: "5. Cell Wall / కణ కవచం", match: "Cellulose / సెల్యులోజ్ నిర్మితం" },
    { term: "6. Chloroplast / హరితరేణువు", match: "Photosynthesis / కిరణజన్య సంయోగక్రియ" },
    { term: "7. Leucoplast / ల్యూకోప్లాస్ట్", match: "Colorless plastid / వర్ణరహిత ప్లాస్టిడ్" },
    { term: "8. Smooth ER / నునుపు అంతర్జీవ ద్రవ్యజాలం", match: "Lipid synthesis / లిపిడ్ల సంశ్లేషణ" },
    { term: "9. Rudolf Virchow / రుడాల్ఫ్ విర్కోవ్", match: "Omnis cellula-e-cellula / కణ విభజన భావన" },
    { term: "10. Cristae / క్రిస్టే", match: "Mitochondrial folds / మైటోకాండ్రియా ముడతలు" },
    { term: "11. Nucleus / కేంద్రకం", match: "Control room of cell / కణ నియంత్రణ గది" },
    { term: "12. Camillo Golgi / కామిల్లో గాల్జీ", match: "Golgi apparatus / గాల్జీ సంక్లిష్టం" },
    { term: "13. Vacuoles / రిక్తికలు", match: "Turgidity & Storage / కణ పీడనం, నిల్వ" },
    { term: "14. Plasma Membrane / ప్లాస్మా పొర", match: "Selectively permeable / విచక్షణ స్తరం" },
    { term: "15. Janus Green-B / జానస్ గ్రీన్-బి", match: "Stain for Mitochondria / మైటోకాండ్రియా రంజనం" }
];

let formDiv = document.getElementById("matching-form");
let shuffled = [...pairs].map(p => p.match).sort(() => Math.random() - 0.5);

pairs.forEach((p, idx) => {
    let opts = `<option value="">-- ఎంచుకోండి (Select) --</option>`;
    shuffled.forEach(m => {
        opts += `<option value="${m}">${m}</option>`;
    });
    formDiv.innerHTML += `
        <div class="match-row">
            <span>${p.term}</span>
            <select id="sel-${idx}">${opts}</select>
        </div>
    `;
});

function checkMatches() {
    let score = 0;
    pairs.forEach((p, idx) => {
        let sel = document.getElementById(`sel-${idx}`);
        if (sel.value === p.match) {
            sel.style.backgroundColor = "#28a745";
            sel.style.color = "#ffffff";
            score++;
        } else {
            sel.style.backgroundColor = "#dc3545";
            sel.style.color = "#ffffff";
        }
    });
    let res = document.getElementById("result");
    let badgeText = score >= 12 ? "EXCELLENT!" : "WELL TRIED!";
    res.innerHTML = `
        <div class="score-text">Your Score: ${score} / 15</div>
        <span class="badge">${badgeText}</span>
        <button class="retry-btn" onclick="location.reload()">RETRY</button>
    `;
}
</script>
</body>
</html>
